syntax = "proto3";

option java_multiple_files = true;

package anki.stats;

import "anki/generic.proto";
import "anki/cards.proto";

service StatsService {
  rpc CardStats(cards.CardId) returns (CardStatsResponse);
  rpc GetReviewLogs(cards.CardId) returns (ReviewLogs);
  rpc Graphs(GraphsRequest) returns (GraphsResponse);
  rpc GetGraphPreferences(generic.Empty) returns (GraphPreferences);
  rpc SetGraphPreferences(GraphPreferences) returns (generic.Empty);
  // MCAT readiness: per-topic mastery aggregation powering the Memory score and
  // the coverage/abstention gate. Groups cards by note tags under `topic_prefix`.
  rpc TopicMastery(TopicMasteryRequest) returns (TopicMasteryResponse);
  // MCAT readiness: the three separated scores (memory, performance, readiness)
  // per section, each with a range + evidence, with the give-up rule enforced.
  // Inference runs here in the engine so desktop and AnkiDroid show identical
  // numbers; model training stays offline and feeds in via `params`.
  rpc ComputeReadiness(ReadinessRequest) returns (ReadinessResponse);
  // MCAT readiness: order due cards by points-at-stake (topic weight x forgetting
  // risk) so the highest-value cards can be studied first.
  rpc PointsAtStakeOrder(PointsAtStakeRequest) returns (PointsAtStakeResponse);
  // MCAT knowledge graph: per-node mastery + prerequisite "learning_ready" gate
  // + points-at-stake + a recommended traversal path. Powers the cue-diagnostics
  // graph so the learner always has a next concept to master.
  rpc TopicGraph(TopicGraphRequest) returns (TopicGraphResponse);
}

// Implicitly includes any of the above methods that are not listed in the
// backend service.
service BackendStatsService {}

message ReviewLogs {
  repeated CardStatsResponse.StatsRevlogEntry entries = 1;
}

message CardStatsResponse {
  message StatsRevlogEntry {
    int64 time = 1;
    RevlogEntry.ReviewKind review_kind = 2;
    uint32 button_chosen = 3;
    // seconds
    uint32 interval = 4;
    // per mill
    uint32 ease = 5;
    float taken_secs = 6;
    optional cards.FsrsMemoryState memory_state = 7;
    // seconds
    uint32 last_interval = 8;
  }
  repeated StatsRevlogEntry revlog = 1;
  int64 card_id = 2;
  int64 note_id = 3;
  string deck = 4;
  // Unix timestamps
  int64 added = 5;
  optional int64 first_review = 6;
  optional int64 latest_review = 7;
  optional int64 due_date = 8;
  optional int32 due_position = 9;
  // days
  uint32 interval = 10;
  // per mill
  uint32 ease = 11;
  uint32 reviews = 12;
  uint32 lapses = 13;
  float average_secs = 14;
  float total_secs = 15;
  string card_type = 16;
  string notetype = 17;
  optional cards.FsrsMemoryState memory_state = 18;
  // not set if due date/state not available
  optional float fsrs_retrievability = 19;
  string custom_data = 20;
  string preset = 21;
  optional string original_deck = 22;
  optional float desired_retention = 23;
  repeated float fsrs_params = 24;
}

message GraphsRequest {
  string search = 1;
  uint32 days = 2;
}

// --- MCAT readiness: topic mastery query ---------------------------------
message TopicMasteryRequest {
  // Anki search limiting which cards to consider (empty = whole collection).
  string search = 1;
  // Tag namespace that marks MCAT topics, e.g. "mcat" matches tags like
  // "mcat::bb::amino_acids_proteins".
  string topic_prefix = 2;
  // A card counts as "mastered" when its FSRS retrievability exceeds this.
  float mastered_threshold = 3;
}

message TopicMasteryResponse {
  repeated TopicMasteryStats topics = 1;
}

// Per-topic evidence behind the Memory score. No bare numbers: every field is a
// measured quantity the dashboard can attribute (cards, reviews, recall).
message TopicMasteryStats {
  // Full tag, e.g. "mcat::bb::amino_acids_proteins".
  string topic_id = 1;
  // Cards carrying this topic tag within the search.
  uint32 card_count = 2;
  // Cards whose current FSRS retrievability > mastered_threshold.
  uint32 mastered_count = 3;
  // Card-weighted mean FSRS retrievability for this topic (the Memory signal).
  float mean_retrievability = 4;
  // Total graded reviews behind these cards (evidence volume for abstention).
  uint32 graded_reviews = 5;
}

// --- MCAT readiness: the three scores -------------------------------------
// Coefficients + give-up thresholds. Trained offline (Python), passed in here so
// the engine only does inference (keeps the engine exam-agnostic).
message ReadinessParams {
  float b0 = 1;
  float b_m = 2;
  float b_p = 3;
  float b_c = 4;
  uint32 min_graded_reviews = 5;  // give-up: per-section reviews
  float min_coverage = 6;         // give-up: per-section coverage fraction
  float max_irt_se = 7;           // give-up: max IRT standard error
}

// One MCAT section. Topic weights + the offline-estimated performance signal are
// supplied by the caller (which bundles the AAMC outline); memory is measured
// here from the live cards.
message ReadinessSectionInput {
  string section = 1;                  // "BB" | "CP" | "PS" | "CARS"
  string topic_prefix = 2;             // e.g. "mcat::bb"
  map<string, float> topic_weights = 3;  // topic_id -> within-section weight
  float performance = 4;               // P_s from the IRT model (offline)
  float theta_se = 5;                  // IRT standard error for P_s
  float alpha_space = 6;               // learning-science multipliers (each cited)
  float alpha_inter = 7;
  float alpha_test = 8;
}

message ReadinessRequest {
  string search = 1;
  float mastered_threshold = 2;
  repeated ReadinessSectionInput sections = 3;
  ReadinessParams params = 4;
}

// One score with its evidence. Never a bare number: if it cannot be justified,
// `abstained` is true and `missing` lists what's needed.
message EvidencedScore {
  float value = 1;
  float range_lo = 2;
  float range_hi = 3;
  string confidence = 4;          // low | moderate | high
  uint32 graded_reviews = 5;
  float coverage_pct = 6;
  string method = 7;              // named source/method behind the number
  bool abstained = 8;
  repeated string missing = 9;
  repeated string drivers = 10;   // human-readable reasons
}

message ReadinessSection {
  string section = 1;
  EvidencedScore memory = 2;
  EvidencedScore performance = 3;
  EvidencedScore readiness = 4;
  string next_best_topic = 5;
  float next_best_points_at_stake = 6;
}

message ReadinessResponse {
  repeated ReadinessSection sections = 1;
  // Total MCAT 472-528. Abstains if any section abstains.
  EvidencedScore total = 2;
  // Global, ranked "what to do next" list across all sections. Always populated
  // (most useful when readiness is withheld): the single highest-value study
  // actions, each with a learning-science rationale.
  repeated NextAction next_actions = 3;
}

// --- MCAT readiness: points-at-stake study order -------------------------
message PointsAtStakeRequest {
  string search = 1;
  // topic_id -> within-section weight (caller bundles the AAMC outline).
  map<string, float> topic_weights = 2;
  float mastered_threshold = 3;
}

message PointsAtStakeResponse {
  repeated PointsAtStakeCard cards = 1;
}

message PointsAtStakeCard {
  int64 card_id = 1;
  string topic_id = 2;
  // topic_weight * (1 - retrievability)
  float points_at_stake = 3;
  float retrievability = 4;
}

// One recommended study action, rooted in learning science.
message NextAction {
  string section = 1;
  // Topic tag for topic-level actions; empty for section-level actions.
  string topic_id = 2;
  // "cover" (untested topic), "review" (forgetting risk), or
  // "practice_check" (need transfer/performance evidence).
  string action_type = 3;
  // topic_weight * (1 - retrievability); uncovered topics carry full weight.
  float points_at_stake = 4;
  // Human-readable, learning-science-grounded reason.
  string reason = 5;
}

// --- MCAT knowledge graph (cue-diagnostics graph) ------------------------
message TopicGraphNode {
  string id = 1;       // == topic tag, e.g. "mcat::bb::enzymes"
  string section = 2;  // BB | CP | PS | CARS
  string label = 3;    // human-readable name
  float weight = 4;    // within-section AAMC weight
}

message TopicGraphEdge {
  string from = 1;  // prerequisite concept
  string to = 2;    // concept that depends on `from`
}

message TopicGraphRequest {
  string search = 1;             // Anki search limiting cards (empty = whole collection)
  string topic_prefix = 2;       // tag namespace, default "mcat"
  float mastered_threshold = 3;  // per-card retrievability threshold for "mastered card"
  float mastery_threshold = 4;   // node mean-retrievability >= this => node mastered
  repeated TopicGraphNode nodes = 5;
  repeated TopicGraphEdge prereq_edges = 6;  // directed A->B
}

message TopicGraphNodeStat {
  string id = 1;
  string section = 2;
  string label = 3;
  float weight = 4;
  uint32 card_count = 5;
  uint32 mastered_count = 6;
  float mean_retrievability = 7;
  uint32 graded_reviews = 8;
  bool covered = 9;            // has at least one card
  bool mastered = 10;          // covered AND mean_retrievability >= mastery_threshold
  bool learning_ready = 11;    // every prerequisite is mastered (or none)
  float points_at_stake = 12;  // weight * (1 - mean_retr); uncovered carries full weight
  repeated string unmet_prereqs = 13;  // prerequisites not yet mastered
}

message TopicGraphResponse {
  repeated TopicGraphNodeStat nodes = 1;
  // Recommended traversal: unmastered node ids in a prerequisite-respecting,
  // points-at-stake-greedy order. The first entry is the single next concept.
  repeated string recommended_path = 2;
}

message GraphsResponse {
  message Added {
    map<int32, uint32> added = 1;
  }
  message Intervals {
    map<uint32, uint32> intervals = 1;
  }
  message Eases {
    map<uint32, uint32> eases = 1;
    float average = 2;
  }
  message Retrievability {
    map<uint32, uint32> retrievability = 1;
    float average = 2;
    float sum_by_card = 3;
    float sum_by_note = 4;
  }
  message FutureDue {
    map<int32, uint32> future_due = 1;
    bool have_backlog = 2;
    uint32 daily_load = 3;
  }
  message Today {
    uint32 answer_count = 1;
    uint32 answer_millis = 2;
    uint32 correct_count = 3;
    uint32 mature_correct = 4;
    uint32 mature_count = 5;
    uint32 learn_count = 6;
    uint32 review_count = 7;
    uint32 relearn_count = 8;
    uint32 early_review_count = 9;
  }
  // each bucket is a 24 element vec
  message Hours {
    message Hour {
      uint32 total = 1;
      uint32 correct = 2;
    }
    repeated Hour one_month = 1;
    repeated Hour three_months = 2;
    repeated Hour one_year = 3;
    repeated Hour all_time = 4;
  }
  message ReviewCountsAndTimes {
    message Reviews {
      uint32 learn = 1;
      uint32 relearn = 2;
      uint32 young = 3;
      uint32 mature = 4;
      uint32 filtered = 5;
    }
    map<int32, Reviews> count = 1;
    map<int32, Reviews> time = 2;
  }
  // 4 element vecs for buttons 1-4
  message Buttons {
    message ButtonCounts {
      repeated uint32 learning = 1;
      repeated uint32 young = 2;
      repeated uint32 mature = 3;
    }
    ButtonCounts one_month = 1;
    ButtonCounts three_months = 2;
    ButtonCounts one_year = 3;
    ButtonCounts all_time = 4;
  }
  message CardCounts {
    message Counts {
      uint32 newCards = 1;
      uint32 learn = 2;
      uint32 relearn = 3;
      uint32 young = 4;
      uint32 mature = 5;
      uint32 suspended = 6;
      uint32 buried = 7;
    }
    // Buried/suspended cards are included in counts; suspended/buried counts
    // are 0.
    Counts including_inactive = 1;
    // Buried/suspended cards are counted separately.
    Counts excluding_inactive = 2;
  }
  message TrueRetentionStats {
    message TrueRetention {
      uint32 young_passed = 1;
      uint32 young_failed = 2;
      uint32 mature_passed = 3;
      uint32 mature_failed = 4;
    }

    TrueRetention today = 1;
    TrueRetention yesterday = 2;
    TrueRetention week = 3;
    TrueRetention month = 4;
    TrueRetention year = 5;
    TrueRetention all_time = 6;
  }

  Buttons buttons = 1;
  CardCounts card_counts = 2;
  Hours hours = 3;
  Today today = 4;
  Eases eases = 5;
  Eases difficulty = 11;
  Intervals intervals = 6;
  FutureDue future_due = 7;
  Added added = 8;
  ReviewCountsAndTimes reviews = 9;
  uint32 rollover_hour = 10;
  Retrievability retrievability = 12;
  bool fsrs = 13;
  Intervals stability = 14;
  TrueRetentionStats true_retention = 15;
}

message GraphPreferences {
  enum Weekday {
    SUNDAY = 0;
    MONDAY = 1;
    FRIDAY = 5;
    SATURDAY = 6;
  }
  Weekday calendar_first_day_of_week = 1;
  bool card_counts_separate_inactive = 2;
  bool browser_links_supported = 3;
  bool future_due_show_backlog = 4;
}

message RevlogEntry {
  enum ReviewKind {
    LEARNING = 0;
    REVIEW = 1;
    RELEARNING = 2;
    FILTERED = 3;
    MANUAL = 4;
    RESCHEDULED = 5;
  }
  int64 id = 1;
  int64 cid = 2;
  int32 usn = 3;
  uint32 button_chosen = 4;
  int32 interval = 5;
  int32 last_interval = 6;
  uint32 ease_factor = 7;
  uint32 taken_millis = 8;
  ReviewKind review_kind = 9;
}

message CardEntry {
  int64 id = 1;
  int64 note_id = 2;
  int64 deck_id = 3;
}

message DeckEntry {
  int64 id = 1;
  int64 parent_id = 2;
  int64 preset_id = 3;
}

message Dataset {
  repeated RevlogEntry revlogs = 1;
  repeated CardEntry cards = 2;
  repeated DeckEntry decks = 3;
  int64 next_day_at = 4;
}
